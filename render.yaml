services:
  - type: web
    name: mm-subtitle-generator-v2
    runtime: docker
    plan: starter # Groq API သုံးပါက Starter ($7/mo - 512MB RAM) နဲ့တင် အလွန်မြန်ဆန်စွာ အလုပ်လုပ်ပါသည်
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
